services:
  - type: web
    name: act-sp-homepage
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: CREATE_TABLES
        value: false
      - key: DATABASE_URL
        sync: false
